<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PrepForge — C/C++ Interview Prep</title>
  <meta name="description" content="Pattern-based LeetCode roadmap with C++ solutions, plus in-depth C/C++, design, math, embedded, CUDA and AI study guides.">
  <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f7fb" media="(prefers-color-scheme: light)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237c5cff'/%3E%3Cpath d='M22 20 10 32l12 12M42 20l12 12-12 12M36 16l-8 32' stroke='white' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Apply saved theme before paint to avoid a flash.
    (function () {
      try {
        var t = localStorage.getItem('pf.theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand-logo" aria-hidden="true">&lt;/&gt;</span>
      <span class="brand-name">PrepForge</span>
    </a>
    <nav class="topnav" id="topnav" aria-label="Main"></nav>
    <div class="top-actions">
      <button class="icon-btn" id="searchBtn" aria-label="Search (press /)" title="Search (/)">
        <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle theme">
        <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <div class="loading">Loading…</div>
  </main>

  <nav class="bottomnav" id="bottomnav" aria-label="Main mobile"></nav>

  <div class="search-overlay" id="searchOverlay" hidden>
    <div class="search-panel" role="dialog" aria-label="Search">
      <div class="search-input-row">
        <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="Search problems, docs, patterns…" autocomplete="off">
        <button class="icon-btn" id="searchClose" aria-label="Close search">✕</button>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <noscript><p style="padding:2rem">PrepForge needs JavaScript enabled.</p></noscript>
  <script src="js/manifest.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
